<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>情感问答小程序 Design System</title>
  <style>
    :root {
      --bg: #fbf8f3;
      --bg-soft: #f8f4ef;
      --surface: #fffcfa;
      --primary: #d46b65;
      --primary-strong: #c95450;
      --primary-soft: #fff1ef;
      --text: #292631;
      --text-strong: #231f1d;
      --secondary: #776c66;
      --muted: #98918d;
      --border: #eee5df;
      --border-strong: #ded6d0;
      --shadow: 0 14px 36px rgba(70, 55, 45, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
      font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }

    .shell {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 28px 22px;
      overflow: auto;
      background: rgba(255, 252, 250, 0.74);
      border-right: 1px solid var(--border);
    }

    main {
      width: min(1120px, 100%);
      padding: 48px 56px 72px;
    }

    .brand {
      margin-bottom: 28px;
    }

    .brand-title {
      margin: 0;
      color: var(--text-strong);
      font-size: 24px;
      font-weight: 800;
      line-height: 1.25;
    }

    .brand-subtitle {
      margin: 8px 0 0;
      color: var(--secondary);
      font-size: 13px;
    }

    .toc-title {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .toc {
      display: grid;
      gap: 6px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .toc a {
      display: block;
      padding: 8px 10px;
      color: var(--secondary);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
    }

    .toc a:hover {
      color: var(--primary-strong);
      background: var(--primary-soft);
    }

    .doc {
      padding: 42px;
      background: rgba(255, 252, 250, 0.88);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    h1,
    h2,
    h3 {
      color: var(--text-strong);
      line-height: 1.25;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 36px;
      font-weight: 800;
    }

    h2 {
      margin: 42px 0 16px;
      padding-top: 10px;
      font-size: 24px;
      font-weight: 800;
      border-top: 1px solid var(--border);
    }

    h3 {
      margin: 28px 0 12px;
      font-size: 18px;
      font-weight: 800;
    }

    p {
      margin: 10px 0 16px;
      color: var(--secondary);
    }

    ul {
      margin: 12px 0 20px;
      padding-left: 22px;
      color: var(--secondary);
    }

    li {
      margin: 6px 0;
    }

    table {
      width: 100%;
      margin: 16px 0 28px;
      overflow: hidden;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    th,
    td {
      padding: 13px 14px;
      vertical-align: top;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th {
      color: var(--text-strong);
      font-size: 13px;
      font-weight: 800;
      text-align: left;
      background: var(--bg-soft);
      white-space: nowrap;
    }

    td {
      color: var(--secondary);
      font-size: 14px;
    }

    code {
      padding: 2px 6px;
      color: var(--primary-strong);
      background: var(--primary-soft);
      border-radius: 6px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.92em;
    }

    pre {
      margin: 16px 0 28px;
      padding: 18px;
      overflow: auto;
      color: #fdf7f4;
      background: #2d2524;
      border-radius: var(--radius);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    pre code {
      padding: 0;
      color: inherit;
      background: transparent;
      border-radius: 0;
      font-size: 13px;
    }

    blockquote {
      margin: 18px 0;
      padding: 14px 16px;
      color: var(--secondary);
      background: var(--primary-soft);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
    }

    .loading,
    .error {
      padding: 18px 20px;
      color: var(--secondary);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .error {
      color: #b84f4a;
      background: #fdebea;
    }

    @media (max-width: 920px) {
      .shell {
        display: block;
      }

      aside {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      main {
        padding: 24px 16px 48px;
      }

      .doc {
        padding: 24px 18px;
        border-radius: 16px;
      }

      h1 {
        font-size: 28px;
      }

      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <section class="brand">
        <h1 class="brand-title">情感问答 Design System</h1>
        <p class="brand-subtitle">基于当前小程序界面与产品理念整理，不参考外部设计图。</p>
      </section>
      <p class="toc-title">目录</p>
      <ul id="toc" class="toc"></ul>
    </aside>
    <main>
      <article id="doc" class="doc">
        <div class="loading">正在加载设计规范...</div>
      </article>
    </main>
  </div>

  <script>
    const docEl = document.getElementById("doc");
    const tocEl = document.getElementById("toc");

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function slugify(value, index) {
      return `section-${index}-${value.replace(/[^\u4e00-\u9fa5a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "")}`;
    }

    function renderTable(lines) {
      const rows = lines
        .filter((line) => line.trim().startsWith("|"))
        .map((line) => line.trim().slice(1, -1).split("|").map((cell) => cell.trim()));
      const header = rows[0] || [];
      const body = rows.slice(2);
      return [
        "<table>",
        "<thead><tr>",
        header.map((cell) => `<th>${inlineMarkdown(cell)}</th>`).join(""),
        "</tr></thead>",
        "<tbody>",
        body.map((row) => `<tr>${row.map((cell) => `<td>${inlineMarkdown(cell)}</td>`).join("")}</tr>`).join(""),
        "</tbody>",
        "</table>"
      ].join("");
    }

    function renderMarkdown(markdown) {
      const lines = markdown.split(/\r?\n/);
      const html = [];
      const headings = [];
      let i = 0;
      let headingIndex = 0;

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        if (!trimmed) {
          i += 1;
          continue;
        }

        if (trimmed.startsWith("```")) {
          const lang = trimmed.slice(3).trim();
          const code = [];
          i += 1;
          while (i < lines.length && !lines[i].trim().startsWith("```")) {
            code.push(lines[i]);
            i += 1;
          }
          i += 1;
          html.push(`<pre><code class="language-${escapeHtml(lang)}">${escapeHtml(code.join("\n"))}</code></pre>`);
          continue;
        }

        if (/^#{1,3}\s+/.test(trimmed)) {
          const level = trimmed.match(/^#+/)[0].length;
          const text = trimmed.replace(/^#{1,3}\s+/, "");
          const id = slugify(text, headingIndex);
          headingIndex += 1;
          if (level === 2) headings.push({ id, text });
          html.push(`<h${level} id="${id}">${inlineMarkdown(text)}</h${level}>`);
          i += 1;
          continue;
        }

        if (trimmed.startsWith("|") && lines[i + 1] && lines[i + 1].includes("---")) {
          const tableLines = [];
          while (i < lines.length && lines[i].trim().startsWith("|")) {
            tableLines.push(lines[i]);
            i += 1;
          }
          html.push(renderTable(tableLines));
          continue;
        }

        if (trimmed.startsWith("- ")) {
          const items = [];
          while (i < lines.length && lines[i].trim().startsWith("- ")) {
            items.push(lines[i].trim().slice(2));
            i += 1;
          }
          html.push(`<ul>${items.map((item) => `<li>${inlineMarkdown(item)}</li>`).join("")}</ul>`);
          continue;
        }

        const paragraph = [];
        while (
          i < lines.length &&
          lines[i].trim() &&
          !/^#{1,3}\s+/.test(lines[i].trim()) &&
          !lines[i].trim().startsWith("|") &&
          !lines[i].trim().startsWith("- ") &&
          !lines[i].trim().startsWith("```")
        ) {
          paragraph.push(lines[i].trim());
          i += 1;
        }
        html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
      }

      tocEl.innerHTML = headings
        .map((heading) => `<li><a href="#${heading.id}">${inlineMarkdown(heading.text)}</a></li>`)
        .join("");
      return html.join("\n");
    }

    fetch("./design-system.md")
      .then((response) => {
        if (!response.ok) throw new Error("无法读取 design-system.md");
        return response.text();
      })
      .then((markdown) => {
        docEl.innerHTML = renderMarkdown(markdown);
      })
      .catch((error) => {
        docEl.innerHTML = `<div class="error">${escapeHtml(error.message)}。请通过本地服务器打开此页面，而不是直接双击 file。</div>`;
      });
  </script>
</body>
</html>
